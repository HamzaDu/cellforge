[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cellforge"
version = "0.1.0"
description = "Battery manufacturing calculations: electrode design, capacity, energy density and materials"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["cellforge", "cellforge.data"]

[tool.setuptools.package-data]
"cellforge.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
